name: Visual baselines

# Generates the Playwright visual-regression baselines on Linux and commits
# them. Playwright snapshots are platform-suffixed (`-chromium-linux`), so a
# baseline generated on a maintainer's macOS machine is `-chromium-darwin` and
# CI can never match it. That is why this is a workflow and not a local script:
# the baselines MUST be produced on the same platform the gate runs on.
#
# Run it from the Actions tab (workflow_dispatch) after an intentional visual
# change. It pushes a commit to the branch you ran it from.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to generate baselines on and commit to
        required: true
        default: main

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.event.inputs.branch }}
  cancel-in-progress: true

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The showcase is the page under test, so it must be built from the same
      # sources the baselines will encode.
      - name: Build tokens + catalog + docs site
        run: pnpm run build
        env:
          SITE_URL: https://alebianco.github.io
          BASE_PATH: /control-room-design-system/

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Regenerate baselines
        run: pnpm run test:visual:update

      # Re-run the gate against the freshly written baselines. If this fails the
      # snapshots are non-deterministic (animation, font loading, a live clock)
      # and committing them would only move the flake into CI.
      - name: Verify the new baselines actually pass
        run: pnpm run test:visual

      # BRANCH goes through env, never interpolated into the shell: a branch
      # name is attacker-controllable text and `${{ }}` inside `run:` would
      # splice it straight into the command line.
      - name: Commit baselines
        env:
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A packages/docs/tests/visual.spec.mjs-snapshots
          if git diff --cached --quiet; then
            echo "baselines unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "test(visual): regenerate Linux baselines

          Generated by the visual-baselines workflow on ubuntu-latest so the
          snapshots carry the -chromium-linux suffix the CI gate compares
          against."
          git push origin "HEAD:refs/heads/$BRANCH"
