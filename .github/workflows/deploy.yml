name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Verify the token layer is not stale and the site builds (runs on PRs too).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint + format check (Biome)
        run: pnpm run lint
      - name: Verify generated artifacts match sources (tokens, catalog, skill)
        run: pnpm run verify
      - name: Build tokens + catalog + gallery + docs site
        run: pnpm run build
        env:
          SITE_URL: https://alebianco.github.io
          BASE_PATH: /control-room-design-system/
      - name: Compile framework components (Mitosis → react/vue/svelte/angular/solid)
        run: pnpm run build:components
      - name: Type-check compiled React output (codegen guard)
        run: pnpm run verify:types
      - name: Package consumability gate (react/qwik/vue named exports build + import)
        run: pnpm run test:pkg
      - name: Cross-framework runtime gate (Vue/Svelte/Solid SSR-render the output)
        run: pnpm run test:frameworks
      - name: Styling-contract gate (pt/dt/unstyled coverage + finer tokens + util ports + responsive tokens)
        run: pnpm run test:contract
      - name: Forms core gate (ArkType ⇄ JSON Schema + validation)
        run: pnpm run test:forms
      - name: Theme core gate (contract + brand validation + contrast)
        run: pnpm run test:theme
      - name: Positioning gate (collision-aware overlay placement)
        run: pnpm run test:position
      - name: RTL-safe authoring guard (logical properties)
        run: pnpm run test:rtl
      - name: Appearance-separation guard (no brand colour in the feature layer)
        run: pnpm run test:separation
      - name: Tooling gate (MCP server tools + skill installer)
        run: pnpm run test:tooling
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Accessibility gate (axe, all four themes)
        run: pnpm run test:a11y
      - name: Live islands gate (real components mount + stay interactive)
        run: pnpm run test:islands
      - name: Responsiveness gate (no horizontal overflow @ 375/768/1024)
        run: pnpm run test:responsive
      - name: Visual regression (informational — baselines are env-specific)
        run: pnpm run test:visual
        continue-on-error: true
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/docs/site-dist

  # Deploy to GitHub Pages only from main.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
