name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Verify the token layer is not stale and the site builds (runs on PRs too).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify generated artifacts match sources (tokens, catalog, skill)
        run: npm run verify
      - name: Build tokens + catalog + gallery + docs site
        run: npm run build
        env:
          SITE_URL: https://alebianco.github.io
          BASE_PATH: /control-room-design-system/
      - name: Compile framework components (Mitosis → react/vue/svelte/angular/solid)
        run: npm run build:components
      - name: Type-check compiled React output (codegen guard)
        run: npm run verify:types
      - name: Forms core gate (ArkType ⇄ JSON Schema + validation)
        run: npm run test:forms
      - name: Theme core gate (contract + brand validation + contrast)
        run: npm run test:theme
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Accessibility gate (axe, all four themes)
        run: npm run test:a11y
      - name: Live islands gate (real components mount + stay interactive)
        run: npm run test:islands
      - name: Responsiveness gate (no horizontal overflow @ 375/768/1024)
        run: npm run test:responsive
      - name: Visual regression (informational — baselines are env-specific)
        run: npm run test:visual
        continue-on-error: true
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  # Deploy to GitHub Pages only from main.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
