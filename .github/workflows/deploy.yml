name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Verify the token layer is not stale and the site builds (runs on PRs too).
  build:
    runs-on: ubuntu-latest
    # The gates take ~5 min. The cap is for HANGS, not slowness: `playwright
    # install --with-deps` shells out to apt and has stalled indefinitely (once
    # for 26 min against a 22-56s norm), and without a timeout a stuck job runs
    # to GitHub's 6-hour default before anyone finds out.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint + format check (Biome)
        run: pnpm run lint
      - name: Verify generated artifacts match sources (tokens, catalog, skill)
        run: pnpm run verify
      - name: Build tokens + catalog + gallery + docs site
        run: pnpm run build
        env:
          SITE_URL: https://alebianco.github.io
          BASE_PATH: /control-room-design-system/
      - name: Compile framework components (Mitosis → react/vue/svelte/angular/solid)
        run: pnpm run build:components
      - name: Type-check compiled React output (codegen guard)
        run: pnpm run verify:types
      - name: Package consumability gate (react/qwik/vue named exports build + import)
        run: pnpm run test:pkg
      - name: Cross-framework runtime gate (all 81 components on every target)
        run: pnpm run test:frameworks
      - name: Styling-contract gate (pt/dt/unstyled coverage + finer tokens + util ports incl. position + responsive tokens)
        run: pnpm run test:contract
      - name: Forms core gate (ArkType ⇄ JSON Schema + validation)
        run: pnpm run test:forms
      - name: Theme core gate (contract + brand validation + contrast)
        run: pnpm run test:theme
      - name: Positioning gate (collision-aware overlay placement)
        run: pnpm run test:position
      - name: RTL-safe authoring guard (logical properties)
        run: pnpm run test:rtl
      - name: Appearance-separation guard (no brand colour in the feature layer)
        run: pnpm run test:separation
      - name: Tooling gate (MCP server tools + skill installer)
        run: pnpm run test:tooling
      - name: Install Playwright Chromium
        # `--with-deps` shells out to `apt-get update`, which has now stalled twice
        # on the runner's mirror list (26 min once, then 10 min until this step's
        # timeout killed it) — an upstream flake, nothing to do with this repo.
        # ubuntu-latest already ships the browser libraries Playwright needs, so
        # the browser download alone is enough and skips apt entirely. Fall back to
        # --with-deps only if that bare install fails, and cap the whole thing so a
        # stall cannot eat the job's budget.
        timeout-minutes: 10
        run: |
          pnpm exec playwright install chromium ||
            pnpm exec playwright install --with-deps chromium
      - name: Accessibility gate (axe, all four themes)
        run: pnpm run test:a11y
      - name: Live islands gate (real components mount + stay interactive)
        run: pnpm run test:islands
      - name: Responsiveness gate (no horizontal overflow @ 375/768/1024)
        run: pnpm run test:responsive
      # Blocking as of the first committed -chromium-linux baselines. The suite
      # also fails on a MISSING baseline rather than silently creating one and
      # reporting a green gate that compared nothing. After an intentional
      # visual change, regenerate via the "Visual baselines" workflow
      # (Actions → Visual baselines → Run workflow) — it must run on Linux
      # because Playwright snapshots are platform-suffixed.
      - name: Visual regression (all four themes)
        run: pnpm run test:visual
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/docs/site-dist

  # The example Qwik app is a real consumer of the published packages, with its
  # own npm lockfile outside the pnpm workspace — so nothing above installs or
  # builds it. That blind spot let a dependabot PR bump it to vite@8 while
  # @builder.io/qwik@1.20 still declares `peer vite@">=5 <8"`: `npm ci` fails
  # outright, and the whole build stayed green because no job ever touched it.
  #
  # Kept a separate job on purpose: it must not gate the library build, but it
  # must go red when the example can no longer be installed or built.
  example-console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The example consumes the library through its published subpaths
      # (@alebianco/cr-tokens/css, @alebianco/cr-components/qwik, …) via file:
      # links, so those packages must be BUILT before npm can resolve them.
      - name: Build the packages the example consumes
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:tokens
          pnpm run build:styles
          pnpm run build:components
      # `npm ci` (not `npm install`) so a lockfile that drifted from package.json
      # is an error too, not something quietly reconciled. This is also the check
      # that catches an unsatisfiable peer range — a dependabot PR once proposed
      # vite@8 here while qwik pinned `>=5 <8`, and nothing caught it because
      # no job installed this app.
      - name: Install the example app (peer + lockfile check)
        working-directory: examples/console
        run: npm ci
      # Building it is what exercises those exports maps as a real consumer does.
      - name: Build the example app
        working-directory: examples/console
        run: npm run build

  # Deploy to GitHub Pages only from main.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
