name: Figma check

# Manual only. Validates the Figma token (and optionally lists a file's
# top-level nodes) from GitHub Actions — no laptop required.
#
# Provide the token once: repo Settings → Secrets and variables → Actions →
# New repository secret → name FIGMA_TOKEN (read-only, short-lived).
on:
  workflow_dispatch:
    inputs:
      file_key:
        description: "Figma file key from figma.com/file/<key>/… (optional; blank just validates the token)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  figma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # figma-pull.mjs uses only Node built-ins — no install needed.
      - name: Validate token (+ optional file pull)
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: node scripts/figma-pull.mjs "${{ inputs.file_key }}"
