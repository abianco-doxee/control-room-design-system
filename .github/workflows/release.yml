name: Release

# When changesets land on main, open/update a "Version Packages" PR that bumps
# each package's version and writes its CHANGELOG. Merging that PR publishes the
# bumped packages to GitHub Packages (npm.pkg.github.com) via `changeset publish`.
#
# DORMANT until opted in: the job is gated on the `RELEASE_ENABLED` repo variable
# so CI stays green until the repo is configured for releasing. To turn it on:
#   1. Own the `@control-room` npm scope. GitHub Packages ties a scope to a GitHub
#      org/user of the same name, so `@control-room/*` publishes only under a
#      `control-room` org (this repo's owner is the user `abianco-doxee`). Create a
#      free `control-room` org and move the repo there, or rename the scope.
#   2. Settings → Actions → General → Workflow permissions → enable
#      "Allow GitHub Actions to create and approve pull requests" (needed for the
#      Version Packages PR; the default GITHUB_TOKEN cannot create PRs otherwise).
#   3. Set repo variable RELEASE_ENABLED=true (Settings → Secrets and variables →
#      Actions → Variables).
# See references/monorepo-migration.md ("Publishing").
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ vars.RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
      - run: pnpm install --frozen-lockfile
      - name: Version PR (changesets) / publish to GitHub Packages on merge
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          title: "Release: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
